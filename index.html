<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สต็อกการ์ด PSA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1220;
    --card: #1a1f35;
    --card2: #232a46;
    --accent: #4f8cff;
    --accent2: #6c5ce7;
    --green: #2ecc71;
    --yellow: #f1c40f;
    --gray: #8a93b2;
    --text: #e8ecf6;
    --muted: #9aa3c0;
    --danger: #ff5b6e;
    --border: #2c3354;
  }
  body {
    font-family: "Segoe UI", "Sarabun", Tahoma, sans-serif;
    background: linear-gradient(160deg, #0f1220 0%, #141832 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: .3px; }
  h1 .pill { font-size: .7rem; background: var(--accent2); padding: 3px 9px; border-radius: 999px; vertical-align: middle; margin-left: 6px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px; position: relative; overflow: hidden;
  }
  .stat::after { content:""; position:absolute; right:-30px; top:-30px; width:90px; height:90px; border-radius:50%; background: var(--accent); opacity:.08; }
  .stat .label { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
  .stat .value { font-size: 1.9rem; font-weight: 700; }
  .stat .sub { color: var(--muted); font-size: .78rem; margin-top: 4px; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: none; cursor: pointer; border-radius: 12px; padding: 12px 20px;
    font-size: .95rem; font-weight: 600; color: #fff; transition: transform .08s, filter .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); }
  .search {
    flex: 1; min-width: 180px; background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 12px 16px; border-radius: 12px; font-size: .95rem;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  select.filter {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 12px; font-size: .9rem;
  }

  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  th { text-align: left; color: var(--muted); font-size: .78rem; font-weight: 600; padding: 0 14px 4px; text-transform: uppercase; letter-spacing: .5px; }
  td { background: var(--card); padding: 14px; font-size: .92rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  tr td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; }
  tr td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
  td.name { font-weight: 600; }
  td.name .topic { font-weight: 600; color: var(--accent); font-size: .72rem; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
  td.name .detail { font-weight: 400; color: var(--muted); font-size: .8rem; margin-top: 4px; white-space: pre-wrap; }

  .thumb { width: 46px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: var(--card2); }
  .thumb-empty { width: 46px; height: 64px; border-radius: 8px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.1rem; }

  .img-upload { display: flex; gap: 14px; align-items: center; }
  .img-preview { width: 96px; height: 130px; border-radius: 12px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .8rem; overflow: hidden; flex-shrink: 0; }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; }
  .img-controls { display: flex; flex-direction: column; gap: 8px; }
  .img-controls .btn { padding: 9px 14px; font-size: .85rem; }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 30px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }
  td.muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .profit-pos { color: var(--green); font-weight: 600; }
  .profit-neg { color: var(--danger); font-weight: 600; }
  .dates { font-size: .74rem; color: var(--muted); margin-top: 3px; }
  .dates .d { white-space: nowrap; }

  .badge { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
  .badge.show { background: rgba(79,140,255,.18); color: #7fa9ff; }
  .badge.wait { background: rgba(241,196,15,.18); color: #f1c40f; }
  .badge.sold { background: rgba(46,204,113,.18); color: #2ecc71; }

  .row-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: .9rem;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .big { font-size: 3rem; margin-bottom: 12px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(6,8,18,.7); backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    width: 100%; max-width: 520px; padding: 26px;
  }
  .modal h2 { font-size: 1.25rem; margin-bottom: 20px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px; border-radius: 11px; font-size: .95rem;
    font-family: inherit; resize: vertical;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions .btn { flex: 1; }

  @media (max-width: 640px) {
    th.hide-sm, td.hide-sm { display: none; }
    .stat .value { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🃏 สต็อกการ์ด <span class="pill">PSA</span></h1>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">จำนวนการ์ดทั้งหมด</div>
      <div class="value num" id="statCount">0</div>
      <div class="sub" id="statBreak">โชว์ 0 · รอขาย 0 · ขายแล้ว 0</div>
    </div>
    <div class="stat">
      <div class="label">ยอดรวมราคากลาง</div>
      <div class="value num" id="statMedian">฿0</div>
      <div class="sub">รวมราคากลางของการ์ดทั้งหมด</div>
    </div>
    <div class="stat">
      <div class="label">ยอดรวมราคารับซื้อ</div>
      <div class="value num" id="statBuy">฿0</div>
      <div class="sub" id="statProfit">กำไรคาดการณ์ ฿0</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="openForm()">+ เพิ่มการ์ด</button>
    <input class="search" id="search" placeholder="ค้นหา เรื่อง / ชื่อ / รุ่น / PSA..." oninput="render()">
    <select class="filter" id="topicFilter" onchange="render()">
      <option value="">ทุกเรื่อง</option>
    </select>
    <select class="filter" id="statusFilter" onchange="render()">
      <option value="">ทุกสถานะ</option>
      <option value="show">โชว์</option>
      <option value="wait">รอขาย</option>
      <option value="sold">ขายแล้ว</option>
    </select>
    <select class="filter" id="sortBy" onchange="render()">
      <option value="newest">ใหม่สุดก่อน</option>
      <option value="oldest">เก่าสุดก่อน</option>
      <option value="name">ชื่อ A→Z</option>
      <option value="median_desc">ราคากลาง มาก→น้อย</option>
      <option value="median_asc">ราคากลาง น้อย→มาก</option>
      <option value="profit_desc">กำไร มาก→น้อย</option>
      <option value="buyDate_desc">วันที่ซื้อ ล่าสุด</option>
    </select>
  </div>

  <div class="toolbar">
    <button class="btn btn-ghost" onclick="exportJSON()">⬇️ สำรองข้อมูล (JSON)</button>
    <button class="btn btn-ghost" onclick="exportCSV()">📊 ออกเป็น Excel/CSV</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importJSON(event)">
    <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆️ นำเข้าข้อมูล (JSON)</button>
  </div>

  <div id="tableArea"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">เพิ่มการ์ด</h2>
    <input type="hidden" id="f_id">
    <input type="hidden" id="f_image">
    <div class="field">
      <label>เรื่อง</label>
      <input id="f_topic" placeholder="เช่น Pokemon, One Piece, Dragon Ball...">
    </div>
    <div class="field">
      <label>ชื่อการ์ด *</label>
      <input id="f_name" placeholder="เช่น Charizard, Pikachu...">
    </div>
    <div class="grid2">
      <div class="field">
        <label>รุ่น</label>
        <input id="f_set" placeholder="เช่น Base Set, 151...">
      </div>
      <div class="field">
        <label>หมายเลข PSA</label>
        <input id="f_psa" placeholder="เช่น 10, 9...">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>ราคากลาง (฿)</label>
        <input id="f_median" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <label>ราคารับซื้อ (฿)</label>
        <input id="f_buy" type="number" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>ราคาขาย (฿)</label>
        <input id="f_sell" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <label>สถานะ</label>
        <select id="f_status">
          <option value="show">โชว์</option>
          <option value="wait">รอขาย</option>
          <option value="sold">ขายแล้ว</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>วันที่ซื้อ</label>
        <input id="f_buyDate" type="date">
      </div>
      <div class="field">
        <label>วันที่ขาย</label>
        <input id="f_sellDate" type="date">
      </div>
    </div>
    <div class="field">
      <label>รายละเอียด Card</label>
      <textarea id="f_detail" rows="3" placeholder="รายละเอียดเพิ่มเติม เช่น สภาพ, ตำหนิ, ที่มา..."></textarea>
    </div>
    <div class="field">
      <label>รูป</label>
      <div class="img-upload">
        <div class="img-preview" id="imgPreview">ไม่มีรูป</div>
        <div class="img-controls">
          <input type="file" id="f_imageFile" accept="image/*" style="display:none" onchange="onPickImage(event)">
          <button type="button" class="btn btn-ghost" onclick="document.getElementById('f_imageFile').click()">📷 เลือกรูป</button>
          <button type="button" class="btn btn-ghost" id="imgRemoveBtn" onclick="clearImage()" style="display:none">ลบรูป</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeForm()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveCard()">บันทึก</button>
    </div>
  </div>
</div>

<script>
const KEY = 'psa_cards_v1';
const STATUS = {
  show: { label: 'โชว์', cls: 'show' },
  wait: { label: 'รอขาย', cls: 'wait' },
  sold: { label: 'ขายแล้ว', cls: 'sold' },
};

let cards = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { return []; }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(cards));
    return true;
  } catch (e) {
    alert('พื้นที่จัดเก็บในเครื่องเต็ม (รูปอาจเยอะเกินไป) — ลองลบรูปบางใบหรือใช้รูปเล็กลงครับ');
    return false;
  }
}

function money(n) {
  const v = Number(n) || 0;
  return '฿' + v.toLocaleString('th-TH', { maximumFractionDigits: 0 });
}

function uid() { return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }

// ---- Stats ----
function updateStats() {
  const count = cards.length;
  const totalMedian = cards.reduce((s, c) => s + (Number(c.median) || 0), 0);
  const totalBuy = cards.reduce((s, c) => s + (Number(c.buy) || 0), 0);
  const totalSell = cards.reduce((s, c) => s + (Number(c.sell) || 0), 0);
  const nShow = cards.filter(c => c.status === 'show').length;
  const nWait = cards.filter(c => c.status === 'wait').length;
  const nSold = cards.filter(c => c.status === 'sold').length;

  // กำไรที่ทำได้จริง = เฉพาะใบที่ขายแล้ว (ราคาขาย − ราคารับซื้อ)
  const realized = cards.filter(c => c.status === 'sold')
    .reduce((s, c) => s + ((Number(c.sell) || 0) - (Number(c.buy) || 0)), 0);

  document.getElementById('statCount').textContent = count.toLocaleString('th-TH');
  document.getElementById('statBreak').textContent = `โชว์ ${nShow} · รอขาย ${nWait} · ขายแล้ว ${nSold}`;
  document.getElementById('statMedian').textContent = money(totalMedian);
  document.getElementById('statBuy').textContent = money(totalBuy);
  const profitEl = document.getElementById('statProfit');
  profitEl.textContent = 'กำไรที่ขายได้จริง ' + money(realized);
  profitEl.className = 'sub ' + (realized > 0 ? 'profit-pos' : realized < 0 ? 'profit-neg' : '');
}

// กำไรต่อใบ (ราคาขาย − ราคารับซื้อ)
function cardProfit(c) { return (Number(c.sell) || 0) - (Number(c.buy) || 0); }
function fmtDate(d) { return d ? d.split('-').reverse().join('/') : ''; }

// เติมตัวเลือก "เรื่อง" ในตัวกรองจากข้อมูลที่มี
function refreshTopicFilter() {
  const sel = document.getElementById('topicFilter');
  const cur = sel.value;
  const topics = [...new Set(cards.map(c => c.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  sel.innerHTML = '<option value="">ทุกเรื่อง</option>' +
    topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if (topics.includes(cur)) sel.value = cur;
}

// ---- Render table ----
function render() {
  updateStats();
  refreshTopicFilter();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sf = document.getElementById('statusFilter').value;
  const tf = document.getElementById('topicFilter').value;
  const sortBy = document.getElementById('sortBy').value;
  const area = document.getElementById('tableArea');

  let list = cards.map((c, i) => ({ ...c, _i: i }));
  if (sf) list = list.filter(c => c.status === sf);
  if (tf) list = list.filter(c => (c.topic || '') === tf);
  if (q) list = list.filter(c =>
    (c.topic || '').toLowerCase().includes(q) ||
    (c.name || '').toLowerCase().includes(q) ||
    (c.set || '').toLowerCase().includes(q) ||
    (c.psa || '').toLowerCase().includes(q)
  );

  const sorters = {
    newest: (a, b) => b._i - a._i,
    oldest: (a, b) => a._i - b._i,
    name: (a, b) => (a.name || '').localeCompare(b.name || '', 'th'),
    median_desc: (a, b) => (Number(b.median) || 0) - (Number(a.median) || 0),
    median_asc: (a, b) => (Number(a.median) || 0) - (Number(b.median) || 0),
    profit_desc: (a, b) => cardProfit(b) - cardProfit(a),
    buyDate_desc: (a, b) => (b.buyDate || '').localeCompare(a.buyDate || ''),
  };
  list.sort(sorters[sortBy] || sorters.newest);

  if (list.length === 0) {
    area.innerHTML = `<div class="empty"><div class="big">📭</div>
      ${cards.length === 0 ? 'ยังไม่มีการ์ด — กดปุ่ม “+ เพิ่มการ์ด” เพื่อเริ่มต้น' : 'ไม่พบการ์ดที่ตรงกับเงื่อนไข'}</div>`;
    return;
  }

  let rows = list.map(c => {
    const st = STATUS[c.status] || STATUS.show;
    const img = c.image
      ? `<img class="thumb" src="${c.image}" onclick="openLightbox('${c.id}')" alt="">`
      : `<div class="thumb-empty">🃏</div>`;
    const p = cardProfit(c);
    const profitCell = `<span class="${p > 0 ? 'profit-pos' : p < 0 ? 'profit-neg' : 'muted'}">${p > 0 ? '+' : ''}${money(p)}</span>`;
    const dates = (c.buyDate || c.sellDate)
      ? `<div class="dates">${c.buyDate ? `<span class="d">ซื้อ ${fmtDate(c.buyDate)}</span>` : ''}${c.buyDate && c.sellDate ? ' · ' : ''}${c.sellDate ? `<span class="d">ขาย ${fmtDate(c.sellDate)}</span>` : ''}</div>`
      : '';
    return `<tr>
      <td>${img}</td>
      <td class="name">${c.topic ? `<div class="topic">${esc(c.topic)}</div>` : ''}${esc(c.name)}${c.detail ? `<div class="detail">${esc(c.detail)}</div>` : ''}${dates}</td>
      <td class="muted hide-sm">${esc(c.set || '-')}</td>
      <td class="muted">${esc(c.psa || '-')}</td>
      <td class="num">${money(c.median)}</td>
      <td class="num hide-sm">${money(c.buy)}</td>
      <td class="num hide-sm">${money(c.sell)}</td>
      <td class="num">${profitCell}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" onclick="editCard('${c.id}')" title="แก้ไข">✏️</button>
          <button class="icon-btn del" onclick="delCard('${c.id}')" title="ลบ">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  area.innerHTML = `<table>
    <thead><tr>
      <th>รูป</th>
      <th>ชื่อการ์ด</th>
      <th class="hide-sm">รุ่น</th>
      <th>PSA</th>
      <th>ราคากลาง</th>
      <th class="hide-sm">รับซื้อ</th>
      <th class="hide-sm">ขาย</th>
      <th>กำไร</th>
      <th>สถานะ</th>
      <th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- Form ----
function openForm() {
  document.getElementById('modalTitle').textContent = 'เพิ่มการ์ด';
  document.getElementById('f_id').value = '';
  document.getElementById('f_topic').value = '';
  document.getElementById('f_name').value = '';
  document.getElementById('f_set').value = '';
  document.getElementById('f_psa').value = '';
  document.getElementById('f_median').value = '';
  document.getElementById('f_buy').value = '';
  document.getElementById('f_sell').value = '';
  document.getElementById('f_status').value = 'show';
  document.getElementById('f_buyDate').value = '';
  document.getElementById('f_sellDate').value = '';
  document.getElementById('f_detail').value = '';
  setImage('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('f_topic').focus();
}

function editCard(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modalTitle').textContent = 'แก้ไขการ์ด';
  document.getElementById('f_id').value = c.id;
  document.getElementById('f_topic').value = c.topic || '';
  document.getElementById('f_name').value = c.name || '';
  document.getElementById('f_set').value = c.set || '';
  document.getElementById('f_psa').value = c.psa || '';
  document.getElementById('f_median').value = c.median ?? '';
  document.getElementById('f_buy').value = c.buy ?? '';
  document.getElementById('f_sell').value = c.sell ?? '';
  document.getElementById('f_status').value = c.status || 'show';
  document.getElementById('f_buyDate').value = c.buyDate || '';
  document.getElementById('f_sellDate').value = c.sellDate || '';
  document.getElementById('f_detail').value = c.detail || '';
  setImage(c.image || '');
  document.getElementById('overlay').classList.add('open');
}

function closeForm() { document.getElementById('overlay').classList.remove('open'); }

// ---- Image handling ----
function setImage(dataUrl) {
  document.getElementById('f_image').value = dataUrl || '';
  const preview = document.getElementById('imgPreview');
  const removeBtn = document.getElementById('imgRemoveBtn');
  if (dataUrl) {
    preview.innerHTML = `<img src="${dataUrl}" alt="">`;
    removeBtn.style.display = '';
  } else {
    preview.textContent = 'ไม่มีรูป';
    removeBtn.style.display = 'none';
  }
}

function clearImage() {
  setImage('');
  document.getElementById('f_imageFile').value = '';
}

function onPickImage(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      // ย่อรูปให้ด้านยาวสุดไม่เกิน 700px แล้วแปลงเป็น JPEG เพื่อประหยัดพื้นที่
      const MAX = 700;
      let { width, height } = img;
      if (width > height && width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
      else if (height > MAX) { width = Math.round(width * MAX / height); height = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      setImage(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function openLightbox(id) {
  const c = cards.find(x => x.id === id);
  if (!c || !c.image) return;
  document.getElementById('lightboxImg').src = c.image;
  document.getElementById('lightbox').classList.add('open');
}

function saveCard() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { alert('กรุณากรอกชื่อการ์ด'); return; }
  const data = {
    topic: document.getElementById('f_topic').value.trim(),
    name,
    image: document.getElementById('f_image').value || '',
    set: document.getElementById('f_set').value.trim(),
    psa: document.getElementById('f_psa').value.trim(),
    median: parseFloat(document.getElementById('f_median').value) || 0,
    buy: parseFloat(document.getElementById('f_buy').value) || 0,
    sell: parseFloat(document.getElementById('f_sell').value) || 0,
    status: document.getElementById('f_status').value,
    buyDate: document.getElementById('f_buyDate').value || '',
    sellDate: document.getElementById('f_sellDate').value || '',
    detail: document.getElementById('f_detail').value.trim(),
  };
  const id = document.getElementById('f_id').value;
  if (id) {
    const c = cards.find(x => x.id === id);
    if (c) Object.assign(c, data);
  } else {
    cards.push({ id: uid(), ...data });
  }
  save();
  closeForm();
  render();
}

function delCard(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  if (confirm(`ลบการ์ด "${c.name}" ?`)) {
    cards = cards.filter(x => x.id !== id);
    save();
    render();
  }
}

// ---- Backup / Import ----
function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function dateStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
}

function exportJSON() {
  if (!cards.length) { alert('ยังไม่มีข้อมูลให้สำรอง'); return; }
  download(`สต็อกการ์ด-${dateStamp()}.json`, JSON.stringify(cards, null, 2), 'application/json');
}

function exportCSV() {
  if (!cards.length) { alert('ยังไม่มีข้อมูลให้ส่งออก'); return; }
  const cols = [
    ['เรื่อง', 'topic'], ['ชื่อการ์ด', 'name'], ['รุ่น', 'set'], ['หมายเลข PSA', 'psa'],
    ['ราคากลาง', 'median'], ['ราคารับซื้อ', 'buy'], ['ราคาขาย', 'sell'],
    ['กำไร', c => cardProfit(c)], ['สถานะ', c => (STATUS[c.status] || {}).label || c.status],
    ['วันที่ซื้อ', 'buyDate'], ['วันที่ขาย', 'sellDate'], ['รายละเอียด', 'detail'],
  ];
  const cell = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const header = cols.map(c => cell(c[0])).join(',');
  const rows = cards.map(c => cols.map(col => {
    const v = typeof col[1] === 'function' ? col[1](c) : c[col[1]];
    return cell(v);
  }).join(','));
  // BOM เพื่อให้ Excel อ่านภาษาไทยถูกต้อง
  download(`สต็อกการ์ด-${dateStamp()}.csv`, '﻿' + [header, ...rows].join('\r\n'), 'text/csv;charset=utf-8');
}

function importJSON(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
      const mode = cards.length
        ? confirm(`ไฟล์มี ${data.length} การ์ด\n\nกด "OK" = รวมเข้ากับข้อมูลเดิม\nกด "Cancel" = แทนที่ข้อมูลเดิมทั้งหมด`)
        : true;
      const incoming = data.map(c => ({ ...c, id: c.id || uid() }));
      if (mode) {
        const ids = new Set(cards.map(c => c.id));
        incoming.forEach(c => { if (ids.has(c.id)) c.id = uid(); });
        cards = cards.concat(incoming);
      } else {
        cards = incoming;
      }
      save();
      render();
      alert(`นำเข้าสำเร็จ ${incoming.length} การ์ด`);
    } catch (err) {
      alert('นำเข้าไม่สำเร็จ: ' + err.message);
    }
    document.getElementById('importFile').value = '';
  };
  reader.readAsText(file);
}

// close modal on overlay click / Esc
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeForm();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });

render();

// เปิดฟอร์ม "เพิ่มการ์ด" อัตโนมัติ ถ้า URL ลงท้ายด้วย #add หรือ ?add
function maybeOpenAdd() {
  const h = location.hash.toLowerCase();
  const p = new URLSearchParams(location.search);
  if (h === '#add' || p.has('add')) openForm();
}
maybeOpenAdd();
window.addEventListener('hashchange', maybeOpenAdd);
</script>
